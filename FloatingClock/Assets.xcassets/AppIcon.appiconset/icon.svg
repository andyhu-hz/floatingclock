<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景圆形 -->
    <circle cx="512" cy="512" r="460" fill="url(#gradient1)" />
    
    <!-- 渐变定义 -->
    <defs>
        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
            <feOffset dx="0" dy="10" result="offsetblur" />
            <feFlood flood-color="#000000" flood-opacity="0.3" />
            <feComposite in2="offsetblur" operator="in" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <!-- 时钟外圈 -->
    <circle cx="512" cy="512" r="440" fill="none" stroke="white" stroke-width="20" filter="url(#shadow)" />
    
    <!-- 时钟刻度 -->
    <g transform="translate(512, 512)">
        <!-- 小时刻度 -->
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(0)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(30)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(60)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(90)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(120)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(150)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(180)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(210)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(240)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(270)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(300)" />
        <line x1="0" y1="-400" x2="0" y2="-360" stroke="white" stroke-width="12" transform="rotate(330)" />
    </g>
    
    <!-- 时钟指针 -->
    <g transform="translate(512, 512)">
        <!-- 时针 -->
        <line x1="0" y1="0" x2="0" y2="-200" stroke="white" stroke-width="20" stroke-linecap="round" transform="rotate(45)" />
        <!-- 分针 -->
        <line x1="0" y1="0" x2="0" y2="-280" stroke="white" stroke-width="14" stroke-linecap="round" transform="rotate(180)" />
        <!-- 秒针 -->
        <line x1="0" y1="40" x2="0" y2="-320" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" transform="rotate(270)" />
        <!-- 中心点 -->
        <circle cx="0" cy="0" r="20" fill="white" />
        <circle cx="0" cy="0" r="10" fill="#FF6B6B" />
    </g>
</svg> 